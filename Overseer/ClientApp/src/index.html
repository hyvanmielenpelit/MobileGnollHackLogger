  <style>
    body {
      margin: 0;
      background-color: #121212;
      color: #ffffff;
      font-family: 'Lato', sans-serif;
    }
    .initial-loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100dvh;
      background: radial-gradient(circle at center, #1a1a1a 0%, #0a0a0a 100%);
    }
    .initial-loading-title {
      font-family: 'Cinzel', serif;
      font-size: 3rem;
      font-weight: normal;
      color: #d4af37;
      letter-spacing: 2px;
      margin-bottom: 30px;
      text-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
      text-align: center;
    }
    .initial-spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(212, 175, 55, 0.2);
      border-top-color: #d4af37;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    .initial-loading-text {
      font-size: 1.1rem;
      color: #aaaaaa;
      letter-spacing: 1px;
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="global-loader" class="initial-loading-container">
    <h1 class="initial-loading-title">Gnoll Overseer</h1>
    <div class="initial-spinner"></div>
    <div class="initial-loading-text">Loading application...</div>
  </div>
  <app-root></app-root>
</body>
</html>
