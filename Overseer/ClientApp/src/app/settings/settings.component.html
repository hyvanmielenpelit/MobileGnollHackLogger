<div class="settings-container gh-main-container">
  <div class="header-row">
    <h2>AI Provider Settings</h2>
    <a routerLink="/chat" queryParamsHandling="preserve" class="nav-back-link">&larr; Back to Chat</a>
  </div>
  <form (ngSubmit)="saveSettings()" class="settings-form">
    <div class="form-content">
      
    <div class="margin-y-20">
      <label class="checkbox-label align-start">
        <input type="checkbox" [(ngModel)]="allowMultipleModels" name="allowMultipleModels" class="w-auto m-0 mt-5" aria-describedby="allowMultipleModelsHint" />
        <div>
          <span>Allow Multiple Models</span>
          <span id="allowMultipleModelsHint" class="form-hint mt-5">Enable support for multiple AI models from different providers</span>
        </div>
      </label>
    </div>

    <div class="margin-y-20">
      <label class="checkbox-label align-start">
        <input type="checkbox" [(ngModel)]="spoilerFreeMode" name="spoilerFreeMode" class="w-auto m-0 mt-5" aria-describedby="spoilerFreeHint" />
        <div>
          <span>Spoiler-Free Mode</span>
          <span id="spoilerFreeHint" class="form-hint mt-5">Limit hints to avoid spoiling secrets</span>
        </div>
      </label>
    </div>

    <div class="margin-y-20">
      <label class="checkbox-label align-start">
        <input type="checkbox" [(ngModel)]="enableWebSearch" name="enableWebSearch" class="w-auto m-0 mt-5" aria-describedby="webSearchHint" />
        <div>
          <span>Enable Web Search (Tier 1)</span>
          <span id="webSearchHint" class="form-hint mt-5">Allow the AI to search the public internet for external information. Lowest risk.</span>
        </div>
      </label>
    </div>

    <div class="margin-y-20">
      <label class="checkbox-label align-start">
        <input type="checkbox" [(ngModel)]="enableToolUse" name="enableToolUse" class="w-auto m-0 mt-5" aria-describedby="toolUseHint" />
        <div>
          <span>Enable Server Tools (Tier 2)</span>
          <span id="toolUseHint" class="form-hint mt-5">Allow the AI to use internal Overseer server tools (e.g., GnollHack Wiki search). No game client access.</span>
        </div>
      </label>
    </div>

    <div class="margin-y-20">
      <label class="checkbox-label align-start">
        <input type="checkbox" [(ngModel)]="enableClientTools" name="enableClientTools" class="w-auto m-0 mt-5" aria-describedby="clientToolsHint" (change)="!enableClientTools ? enableGameActions = false : null" />
        <div>
          <span>Enable Client Data Access (Tier 3)</span>
          <span id="clientToolsHint" class="form-hint mt-5">Allow the AI to read your live game state, inventory, and device logs.</span>
        </div>
      </label>
    </div>

    <div class="margin-y-20">
      <label class="checkbox-label align-start">
        <input type="checkbox" [(ngModel)]="enableGameActions" name="enableGameActions" class="w-auto m-0 mt-5" aria-describedby="gameActionsHint" [disabled]="!enableClientTools" />
        <div>
          <span>Enable Game Actions (Tier 4)</span>
          <span id="gameActionsHint" class="form-hint mt-5">Allow the AI to execute commands in your game (e.g., movement, attacks). Requires Tier 3. Highest risk.</span>
        </div>
      </label>
    </div>

    <div class="token-row">
      <div class="flex-1">
        <label for="maxInputTokensInput">Max Input Tokens</label>
        <span id="maxInputHint" class="form-hint">Leave blank for no limit</span>
        <input type="number" id="maxInputTokensInput" [(ngModel)]="maxInputTokens" name="maxInputTokens" class="gh-input w-100 mt-5" aria-describedby="maxInputHint" />
      </div>
      <div class="flex-1">
        <label for="maxOutputTokensInput">Max Output Tokens</label>
        <span id="maxOutputHint" class="form-hint">Leave blank for default</span>
        <input type="number" id="maxOutputTokensInput" [(ngModel)]="maxOutputTokens" name="maxOutputTokens" class="gh-input w-100 mt-5" aria-describedby="maxOutputHint" />
      </div>
    </div>

    </div>
    <div class="form-footer">
      <button type="submit" class="btn-gh save-btn" [disabled]="loading">Save</button>
      <div #successToast popover="manual" class="toast-success">
        &#10004; Settings saved successfully!
      </div>
      <!-- Fallback if polyfill completely fails -->
      <span *ngIf="saved" class="success">Settings saved successfully!</span>
    </div>
  </form>
</div>

<!-- Unsaved Changes Dialog -->
<dialog #confirmDialog class="gh-dialog">
  <form method="dialog">
    <h3 class="modal-title">Unsaved Changes</h3>
    <p>You have unsaved changes. Are you sure you want to discard them and leave?</p>
    <div class="modal-actions mt-20">
      <button value="cancel" class="btn-gh btn-gh-cancel">Cancel</button>
      <button value="discard" class="btn-gh">Discard</button>
    </div>
  </form>
</dialog>
