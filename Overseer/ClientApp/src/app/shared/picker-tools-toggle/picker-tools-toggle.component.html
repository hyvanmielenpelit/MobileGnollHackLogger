<button #button type="button" class="action-btn picker-tools-toggle-btn" [id]="buttonId"
        [attr.aria-label]="label"
        [attr.aria-expanded]="expanded"
        [attr.aria-controls]="controls"
        [attr.aria-disabled]="disabled ? 'true' : null"
        [attr.interestfor]="buttonId + '-tip'"
        [attr.style]="'anchor-name: --' + buttonId"
        (click)="onClick()">
  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
  </svg>
  @if (active) {
    <span class="picker-tools-toggle-dot" aria-hidden="true"></span>
  }
</button>
<div popover="hint" class="gh-tooltip" [id]="buttonId + '-tip'"
     [attr.style]="'position-anchor: --' + buttonId">{{ tooltip }}</div>
