@if (shown) {
  <div class="alert alert-compact model-availability-notice"
       [class.alert-warning]="tone === 'warning'" [class.alert-info]="tone === 'info'" [attr.data-tone]="tone">
    @if (tone === 'warning') {
      <svg class="alert-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
    } @else {
      <svg class="alert-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
    }
    <div class="alert-content">
      @if (headingLevel) {
        <div class="alert-heading" role="heading" [attr.aria-level]="headingLevel">{{ heading }}</div>
      }
      <div class="alert-body">
        <p class="man-sentence">{{ text }}</p>
        @if (replacementName; as replacement) {
          <p class="man-replacement">Suggested replacement: {{ replacement }}</p>
        }
      </div>
      <div class="alert-actions"><ng-content></ng-content></div>
    </div>
  </div>
}
