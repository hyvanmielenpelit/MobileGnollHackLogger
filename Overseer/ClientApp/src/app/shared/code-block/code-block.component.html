<ng-template #copyButton>
  <button type="button" class="action-btn code-block-copy" (click)="copy()"
          [attr.aria-label]="copyLabel"
          [attr.interestfor]="copyTipId"
          [attr.style]="'anchor-name: --' + copyTipId">
    @if (copied) {
      <svg class="btn-icon code-block-glyph" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"></polyline></svg>
    } @else {
      <svg class="btn-icon code-block-glyph" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
    }
  </button>
  <div popover="hint" class="gh-tooltip" [id]="copyTipId"
       [attr.style]="'position-anchor: --' + copyTipId">{{ copyLabel }}</div>
</ng-template>

@if (caption) {
  <div class="code-block-header">
    <span class="code-block-caption">{{ caption }}</span>
    <div class="code-block-actions">
      @if (canDownload) {
        <button type="button" class="action-btn code-block-download" (click)="download()"
                [attr.aria-label]="downloadLabel"
                [attr.interestfor]="downloadTipId"
                [attr.style]="'anchor-name: --' + downloadTipId">
          <svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="12" y1="12" x2="12" y2="18"></line><polyline points="9 15 12 18 15 15"></polyline></svg>
        </button>
        <div popover="hint" class="gh-tooltip" [id]="downloadTipId"
             [attr.style]="'position-anchor: --' + downloadTipId">{{ downloadLabel }}</div>
      }
      <ng-container *ngTemplateOutlet="copyButton"></ng-container>
    </div>
  </div>
} @else {
  <div class="code-block-corner">
    <ng-container *ngTemplateOutlet="copyButton"></ng-container>
  </div>
}

<pre class="code-block-pre" [class.has-corner-button]="!caption"><code>{{ code }}</code></pre>

<span class="visually-hidden" role="status" aria-live="polite">{{ copied ? 'Copied' : '' }}</span>
@if (copyFailed) {
  <p class="code-block-error" role="alert">{{ failureMessage }}</p>
}
