<button type="button" class="gh-info-btn"
        [attr.aria-label]="'About ' + subject"
        [attr.interestfor]="tipId"
        [attr.style]="'anchor-name: --' + tipId">
  <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <circle cx="12" cy="12" r="10"></circle>
    <line x1="12" y1="16" x2="12" y2="12"></line>
    <line x1="12" y1="8" x2="12.01" y2="8"></line>
  </svg>
</button>
<div popover="hint" class="gh-tooltip gh-tooltip-multiline" [id]="tipId"
     [attr.style]="'position-anchor: --' + tipId"><ng-content></ng-content></div>
