<div id="admin-alerts-popover" popover="manual" #popoverContainer class="admin-alerts-container">
  @if (alerts$ | async; as alerts) {
    @for (alert of alerts; track alert.id) {
      <div class="admin-alert" [ngClass]="alert.type">
        <div class="alert-content">
          <strong>⚠️ Admin Alert:</strong> {{ alert.message }}
        </div>
        <button class="dismiss-btn" (click)="dismiss(alert.id)" title="Dismiss Alert">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
    }
  }
</div>
