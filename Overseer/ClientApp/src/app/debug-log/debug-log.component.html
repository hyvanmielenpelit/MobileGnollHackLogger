<div class="debug-container">
  <div class="header">
    <div class="header-left">
      <button (click)="goBack()" class="nav-back-link">&larr; Back</button>
      <h2>Debug Log</h2>
    </div>
    <div class="header-right">
      <button (click)="copyAllLogs()" class="nav-back-link">{{ isCopiedAll ? 'Copied!' : 'Copy All' }}</button>
      <button (click)="clearLogs()" class="nav-back-link btn-clear">Clear</button>
    </div>
  </div>
  <div class="log-viewer gh-main-container">
    @if (logs.length === 0) {
      <div class="empty">No debug logs yet.</div>
    }
    @for (log of logs; track log) {
      <div class="debug-line">
        <span class="time">[{{ log.timestamp | date:'HH:mm:ss.SSS' }}]</span>
        @if (!isLongLog(log.message)) {
          {{ log.message }}
        }
        @if (isLongLog(log.message)) {
          <span>{{ getShortMessage(log.message) }}</span>
          <button class="copy-btn" (click)="copyToClipboard(log)" [title]="copiedLog === log ? 'Copied!' : 'Copy full message'">
            @if (copiedLog !== log) {
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
            }
            @if (copiedLog === log) {
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#28a745" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
            }
          </button>
        }
      </div>
    }
  </div>
</div>
