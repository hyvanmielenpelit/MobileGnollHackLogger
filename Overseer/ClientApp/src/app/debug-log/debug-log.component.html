<div class="debug-container">
  <div class="header">
    <div class="header-left">
      <button (click)="goBack()" class="nav-back-link">&larr; Back</button>
      <h2>Debug Log</h2>
    </div>
    <button (click)="clearLogs()" class="nav-back-link btn-clear">Clear</button>
  </div>
  <div class="log-viewer gh-main-container">
    <div *ngIf="logs.length === 0" class="empty">No debug logs yet.</div>
    <div class="debug-line" *ngFor="let log of logs">
      <span class="time">[{{ log.timestamp | date:'HH:mm:ss.SSS' }}]</span> 
      <ng-container *ngIf="!isLongLog(log.message)">{{ log.message }}</ng-container>
      <ng-container *ngIf="isLongLog(log.message)">
        <span>{{ getShortMessage(log.message) }}</span>
        <button class="copy-btn" (click)="copyToClipboard(log)" [title]="copiedLog === log ? 'Copied!' : 'Copy full message'">
          <svg *ngIf="copiedLog !== log" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
          <svg *ngIf="copiedLog === log" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#28a745" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </button>
      </ng-container>
    </div>
  </div>
</div>
