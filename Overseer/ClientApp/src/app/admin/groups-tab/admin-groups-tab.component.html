<div class="ag-header">
  <h4 class="ag-title">Groups</h4>
  <button class="btn-gh btn-gh-wide" (click)="openCreateGroup()">Create</button>
</div>
@if (store.groups.length === 0) {
  <div class="text-muted italic mt-20 empty-state-msg">
    No groups
  </div>
}
@if (store.groups.length > 0) {
  <div class="table-responsive">
    <table class="admin-table modern-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th style="text-align: right;">Actions</th>
        </tr>
      </thead>
      <tbody>
        @for (group of store.groups; track group) {
          <tr>
            <td data-label="ID">{{ group.id }}</td>
            <td data-label="Name">{{ group.displayName }}</td>
            <td class="actions-cell">
              <button type="button" class="action-btn ag-manage-configs"
                      [attr.aria-label]="'Manage the AI configurations of ' + group.displayName"
                      [attr.interestfor]="'ag-group-' + group.id + '-configs-tip'"
                      [attr.style]="'anchor-name: --ag-group-' + group.id + '-configs-tip'"
                      (click)="openManageGroupConfigs(group)">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
              </button>
              <div popover="hint" class="gh-tooltip" [id]="'ag-group-' + group.id + '-configs-tip'"
                   [attr.style]="'position-anchor: --ag-group-' + group.id + '-configs-tip'">Manage AI configurations</div>
              <button class="action-btn action-btn-danger" title="Delete Group" (click)="deleteGroup(group)">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
              </button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
}

<dialog #createGroupDialog class="gh-dialog">
  <div class="dialog-content flex-col">
    <h3>Create Group</h3>
    <div class="form-group mt-20">
      <label for="newGroupName">Group Name</label>
      <input type="text" id="newGroupName" [(ngModel)]="newGroupName" (keyup.enter)="saveCreateGroup()" class="gh-input w-100">
      @if (createGroupError) {
        <div class="error-text mt-10">
          {{ createGroupError }}
        </div>
      }
    </div>
    <div class="dialog-actions mt-auto pt-20">
      <button class="btn-gh btn-gh-cancel" (click)="closeCreateGroup()">Cancel</button>
      <button class="btn-gh" (click)="saveCreateGroup()" [disabled]="!newGroupName">Create</button>
    </div>
  </div>
</dialog>

<app-admin-confirm-dialog></app-admin-confirm-dialog>
<app-config-access-dialog />
