<div class="dialog-content flex-col">
  <h3>Analytics: {{ configName }}</h3>

  <!-- Controls row -->
  <div class="analytics-controls">
    <div class="control-group">
      <label>Users</label>
      <select class="gh-input" [(ngModel)]="mode" (ngModelChange)="onFilterChange()">
        <option value="all">All Users</option>
        <option value="individual">Individual Users</option>
      </select>
    </div>
    <div class="control-group">
      <label>Data</label>
      <select class="gh-input" [(ngModel)]="dataType" (ngModelChange)="onFilterChange()">
        <option value="requests">Requests</option>
        <option value="tokens">Chat Tokens</option>
      </select>
    </div>
    <div class="control-group">
      <label>Time Span</label>
      <select class="gh-input" [(ngModel)]="timeSpan" (ngModelChange)="onFilterChange()">
        <option value="7d">Last 7 days</option>
        <option value="30d">Last 30 days</option>
        <option value="90d">Last 90 days</option>
        <option value="1y">Last year</option>
        <option value="custom">Custom</option>
      </select>
    </div>
  </div>

  <!-- Custom date range (shown when timeSpan === 'custom') -->
  <div class="analytics-controls" *ngIf="timeSpan === 'custom'">
    <div class="control-group">
      <label>Start Date</label>
      <input type="date" class="gh-input" [(ngModel)]="customStart"
             (ngModelChange)="onFilterChange()">
    </div>
    <div class="control-group">
      <label>End Date</label>
      <input type="date" class="gh-input" [(ngModel)]="customEnd"
             (ngModelChange)="onFilterChange()">
    </div>
  </div>

  <!-- Individual Users Toolbar -->
  <div class="chart-toolbar" *ngIf="mode === 'individual'">
    <div class="pagination-controls">
      <div class="page-size-wrapper">
        <select class="gh-input page-size-select" [(ngModel)]="pageSize" (ngModelChange)="onPageSizeChange()">
          <option *ngFor="let size of pageSizes" [value]="size">{{ size }}</option>
        </select>
        <span class="page-size-label">per page</span>
      </div>
      
      <div class="pagination-buttons">
        <button class="page-btn" [disabled]="page === 1" (click)="onPageChange(page - 1)" title="Previous Page">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
        <button class="page-btn" 
                *ngFor="let p of pageNumbers" 
                [class.active]="p === page"
                (click)="onPageChange(p)">{{ p }}</button>
        <button class="page-btn" [disabled]="page === totalPages" (click)="onPageChange(page + 1)" title="Next Page">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>
      </div>
    </div>
    
    <div class="search-controls">
      <input type="text" class="gh-input" placeholder="Search for username..."
             [(ngModel)]="usernameFilter" (ngModelChange)="onUsernameFilterChange($event)">
    </div>
  </div>

  <!-- Chart area -->
  <div class="chart-wrapper">
    <div class="chart-container">
      <canvas baseChart
        [data]="chartData"
        [options]="chartOptions"
        [plugins]="chartPlugins"
        [type]="chartType">
      </canvas>
    </div>
  </div>

  <div class="dialog-actions mt-auto pt-20">
    <button class="btn-gh btn-gh-cancel" (click)="close.emit()">Close</button>
  </div>
</div>
