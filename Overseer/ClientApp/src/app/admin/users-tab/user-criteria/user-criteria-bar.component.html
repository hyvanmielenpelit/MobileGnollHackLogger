<div class="gh-filter-bar ucb-bar">
  <div class="gh-filter-bar-row">
    <div class="gh-search-field ucb-search">
      <label class="visually-hidden" [for]="searchId">Search users by user name or email</label>
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input type="search" class="gh-input" [id]="searchId" autocomplete="off" placeholder="User name or email"
             [value]="state.searchText" (input)="onSearchInput($event)" (keydown)="onSearchKeydown($event)">
    </div>

    @if (showSort) {
      <div class="ucb-sort">
        <label [for]="sortId">Sort by</label>
        <select class="gh-input" [id]="sortId" (change)="onSortChange($event)">
          @for (option of sorts; track option.id) {
            <option [value]="option.id" [selected]="option.id === sort">{{ option.label }}</option>
          }
        </select>
      </div>
    }

    <div class="gh-facet-row ucb-facet-row">
      @for (facet of facetDefs; track facet.column) {
        <app-filter-facet [facetId]="idPrefix + '-facet-' + facet.column" [label]="facet.label" noun="users"
                          [mode]="facet.mode" [anyLabel]="facet.anyLabel"
                          [options]="optionsOf(facet.column)" [selected]="selectedOf(facet.column)"
                          (selectedChange)="onFacetChange(facet.column, $event)"></app-filter-facet>
      }
    </div>
  </div>

  @if (chips.length > 0) {
    <div class="gh-filter-bar-row ucb-chips-row">
      <ul class="gh-filter-chips ucb-chips" role="list" aria-label="Active filters">
        @for (chip of chips; track chip.key) {
          <li>
            <button type="button" class="gh-filter-chip"
                    [attr.aria-label]="'Remove filter ' + chip.facetLabel + ': ' + chip.valueLabel"
                    (click)="removeChip(chip)">
              <span class="gh-filter-chip-facet">{{ chip.facetLabel }}:</span>
              <span class="gh-filter-chip-value">{{ chip.valueLabel }}</span>
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
          </li>
        }
      </ul>
      <button type="button" class="gh-filter-clear ucb-clear-all" (click)="clearAll()">Clear all</button>
    </div>
  }
</div>
