<dialog #dialog class="gh-dialog uad-dialog uad-ban-dialog" aria-labelledby="uad-ban-title" (close)="onClose()">
  @if (user) {
    <!-- Focused on open, so the dangerous button never holds focus first. -->
    <h3 id="uad-ban-title" tabindex="-1">Ban {{ user.userName }}</h3>

    <div class="uad-field">
      <label for="uad-ban-reason">Reason</label>
      <textarea id="uad-ban-reason" class="gh-input gh-textarea-autosize" rows="3" required
                [attr.maxlength]="reasonMax" aria-describedby="uad-ban-reason-hint"
                (input)="onReason($event)"></textarea>
      <span class="form-hint" id="uad-ban-reason-hint">For administrators only. {{ reason.length }} of {{ reasonMax }} characters.</span>
    </div>

    <p class="uad-effect" id="uad-ban-effect">Cannot sign in anywhere until unbanned. The reason is not shown to the user.</p>

    <label class="checkbox-label align-start uad-check">
      <input type="checkbox" id="uad-ban-check" [checked]="checked" (change)="onChecked($event)">
      <span>I have checked this is the right account ({{ user.email }}).</span>
    </label>

    @if (error) {
      <p class="gh-field-error uad-error" role="alert">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
        <span>{{ error }}</span>
      </p>
    }

    <div class="dialog-actions">
      @if (missingNote) {
        <p class="gh-footer-note" id="uad-ban-note">
          <svg class="gh-footer-note-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
          <span>{{ missingNote }}</span>
        </p>
      }
      <button type="button" class="btn-gh btn-gh-cancel uad-cancel" (click)="close()">Cancel</button>
      <button type="button" class="btn-gh btn-gh-delete uad-confirm"
              [attr.aria-disabled]="canSubmit ? null : 'true'"
              [attr.aria-describedby]="missingNote ? 'uad-ban-note' : null"
              [attr.aria-busy]="busy ? 'true' : null"
              (click)="submit()">{{ busy ? 'Banning…' : 'Ban Account' }}</button>
    </div>
  }
</dialog>
