<dialog #dialog class="gh-dialog uad-dialog uad-email-dialog" aria-labelledby="uad-email-title" (close)="onClose()">
  @if (user) {
    <!-- Focused on open, so the confirm button never holds focus first. -->
    <h3 id="uad-email-title" tabindex="-1">Change the email of {{ user.userName }}</h3>
    <p class="uad-lead" id="uad-email-current">Current address: {{ user.email }}</p>

    <div class="uad-field">
      <label for="uad-email-address">New email address</label>
      <input type="email" id="uad-email-address" class="gh-input" maxlength="256" autocomplete="off" spellcheck="false" required
             (input)="onEmail($event)">
    </div>

    <label class="checkbox-label align-start uad-check">
      <input type="checkbox" id="uad-email-confirmed" [checked]="markConfirmed"
             aria-describedby="uad-email-confirmed-hint"
             (change)="onMarkConfirmed($event)">
      <span>
        Mark the new address as confirmed
        <span id="uad-email-confirmed-hint" class="form-hint">Only when you have verified that the person controls the new address.</span>
      </span>
    </label>

    <p class="uad-effect" id="uad-email-effect">{{ effectText }}</p>

    <div class="uad-field">
      <label for="uad-email-reason">Reason</label>
      <textarea id="uad-email-reason" class="gh-input gh-textarea-autosize" rows="3" required
                [attr.maxlength]="reasonMax" aria-describedby="uad-email-reason-hint"
                (input)="onReason($event)"></textarea>
      <span class="form-hint" id="uad-email-reason-hint">For administrators only. {{ reason.length }} of {{ reasonMax }} characters.</span>
    </div>

    <label class="checkbox-label align-start uad-check">
      <input type="checkbox" id="uad-email-check" [checked]="checked" (change)="onChecked($event)">
      <span>I have checked this is the right account ({{ user.email }}).</span>
    </label>

    @if (error) {
      <p class="gh-field-error uad-error" role="alert">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
        <span>{{ error }}</span>
      </p>
    }

    <div class="dialog-actions">
      @if (missingNote) {
        <p class="gh-footer-note" id="uad-email-note">
          <svg class="gh-footer-note-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
          <span>{{ missingNote }}</span>
        </p>
      }
      <button type="button" class="btn-gh btn-gh-cancel uad-cancel" (click)="close()">Cancel</button>
      <button type="button" class="btn-gh uad-confirm"
              [attr.aria-disabled]="canSubmit ? null : 'true'"
              [attr.aria-describedby]="missingNote ? 'uad-email-note' : null"
              [attr.aria-busy]="busy ? 'true' : null"
              (click)="submit()">{{ busy ? 'Changing…' : 'Change Email' }}</button>
    </div>
  }
</dialog>
