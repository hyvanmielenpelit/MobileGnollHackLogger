<button type="button" class="action-btn kfc-copy"
        [attr.aria-label]="'Copy ' + cardLabel + ' of run ' + runId + ' as an image'"
        [attr.aria-disabled]="busy ? 'true' : null"
        [attr.interestfor]="tipId('copy')"
        [attr.style]="'anchor-name: --' + tipId('copy')"
        (click)="request('copy')">
  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
  </svg>
</button>
<button type="button" class="action-btn kfc-download"
        [attr.aria-label]="'Download ' + cardLabel + ' of run ' + runId + ' as a PNG image'"
        [attr.aria-disabled]="busy ? 'true' : null"
        [attr.interestfor]="tipId('download')"
        [attr.style]="'anchor-name: --' + tipId('download')"
        (click)="request('download')">
  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
    <polyline points="7 10 12 15 17 10"></polyline>
    <line x1="12" y1="15" x2="12" y2="3"></line>
  </svg>
</button>
<div popover="hint" class="gh-tooltip" [id]="tipId('copy')"
     [attr.style]="'position-anchor: --' + tipId('copy')">Copy as image</div>
<div popover="hint" class="gh-tooltip" [id]="tipId('download')"
     [attr.style]="'position-anchor: --' + tipId('download')">Download as PNG</div>
