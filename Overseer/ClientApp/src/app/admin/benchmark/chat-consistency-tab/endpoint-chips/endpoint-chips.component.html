<!-- Static: the verdict banner's chips are buttons, these are a read-out. -->
@if (chips.length > 0) {
  <ul class="cc-ep-chips" role="list" [attr.aria-label]="label">
    @for (chip of chips; track chip.id) {
      <li class="cc-ep-chip" [attr.data-endpoint]="chip.id" [attr.data-status]="chip.status">
        @switch (chip.status) {
          @case ('within') {
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"></polyline></svg>
          }
          @case ('improved') {
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"></polyline></svg>
          }
          @case ('changed') {
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
          }
          @default {
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          }
        }
        <span class="cc-ep-chip-id">{{ chip.id }}</span><span class="visually-hidden">&ngsp;{{ chip.name }}:</span>&ngsp;<span class="cc-ep-chip-word">{{ chip.text }}</span>
      </li>
    }
  </ul>
}
