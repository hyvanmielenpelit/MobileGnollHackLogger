<figure class="cc-figure" [class.is-fixed-width]="boxWidth !== null" [style.inline-size.px]="boxWidth"
        [attr.data-figure]="figure.key" [attr.aria-labelledby]="figureId + '-title'">
  <!-- The chart's header band draws the title; this one names the figure for assistive technology. -->
  <figcaption class="cc-figure-caption" [class.visually-hidden]="titleInChart">
    <span class="cc-figure-title" [id]="figureId + '-title'">{{ figure.title }}</span>
  </figcaption>

  @if (chartData) {
    <div class="cc-chart-box" [style.inline-size.px]="boxWidth" [style.block-size.px]="boxHeight">
      @if (render) {
        <canvas baseChart role="img" [attr.aria-label]="figure.altText"
                [attr.aria-describedby]="figure.markers.length > 0 ? markersId : null"
                [type]="chartType" [data]="chartData" [options]="chartOptions" [plugins]="chartPlugins"></canvas>
      }
    </div>
  } @else {
    <p class="cc-figure-empty">Nothing to chart in this range.</p>
  }

  <p class="cc-figure-takeaway" [id]="figureId + '-takeaway'">{{ figure.takeaway }}</p>

  @if (figure.markers.length > 0) {
    <ul class="visually-hidden" [id]="markersId" [attr.aria-label]="'Markers on ' + figure.title">
      @for (marker of figure.markers; track marker.tag) {
        <li>{{ marker.tag }}: {{ marker.label }}</li>
      }
    </ul>
  }

  <!-- Hidden by CSS while it holds neither markers nor projected actions. -->
  <div class="cc-figure-footer">
    @if (figure.markers.length > 0) {
      <!-- The spaces and punctuation are pieces of their own: whitespace-only template text is dropped. -->
      <p class="cc-figure-markers">
        @for (piece of markerPieces; track $index) {
          <span [class]="piece.className">{{ piece.text }}</span>
        }
        @if (showEvents.observed) {
          <button type="button" class="btn-link cc-figure-show-events" (click)="showEvents.emit()">Show events</button>
        }
      </p>
    }
    <div class="cc-figure-actions"><ng-content select="[ccFigureActions]" /></div>
  </div>

  <details class="gh-disclosure cc-figure-data">
    <summary>Show data<span class="cc-figure-data-count">&ngsp;· {{ dataSummary }}</span></summary>
    <div class="gh-disclosure-body">
      <p class="visually-hidden" [id]="figureId + '-data-title'">{{ figure.title }}: data per {{ unitNoun }}</p>
      <ul role="list" class="cc-data-cards" [attr.aria-labelledby]="figureId + '-data-title'">
        @for (card of dataCards; track card.id) {
          <li>
            <article class="cc-data-card" [attr.aria-labelledby]="card.id + '-title'">
              <div class="cc-data-card-head">
                @if (dataHeadingLevel === 5) {
                  <h5 class="cc-data-card-title" [id]="card.id + '-title'">{{ card.title }}</h5>
                } @else {
                  <h6 class="cc-data-card-title" [id]="card.id + '-title'">{{ card.title }}</h6>
                }
                <span class="cc-data-card-meta">{{ card.started }}</span>
              </div>
              <dl class="cc-data-card-fields">
                @for (field of card.fields; track $index) {
                  <div class="cc-data-field" [class.is-wide]="field.wide">
                    <dt>{{ field.label }}</dt>
                    <dd>
                      @if (field.items) {
                        <!-- &ngsp; keeps the space between the id and the suite name. -->
                        <ul role="list" class="cc-data-list">
                          @for (item of field.items; track $index) {
                            <li><span class="cc-data-ref">{{ item.ref }}</span>@if (item.label) {&ngsp;<span class="cc-data-ref-label">{{ item.label }}</span>}</li>
                          }
                        </ul>
                      } @else {
                        {{ field.value }}
                      }
                    </dd>
                  </div>
                }
              </dl>
            </article>
          </li>
        } @empty {
          <li class="cc-data-empty">No {{ unitNoun }}s in this range.</li>
        }
      </ul>
    </div>
  </details>
</figure>
