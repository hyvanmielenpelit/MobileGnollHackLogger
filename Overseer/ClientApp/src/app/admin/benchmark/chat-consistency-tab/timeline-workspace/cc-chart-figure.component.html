<figure class="cc-figure" [class.is-fixed-width]="boxWidth !== null" [style.inline-size.px]="boxWidth"
        [attr.data-figure]="figure.key" [attr.aria-labelledby]="figureId + '-title'">
  <figcaption class="cc-figure-caption">
    <!-- The chart's header band draws the title; this one names the figure for assistive technology. -->
    <span class="cc-figure-title" [class.visually-hidden]="titleInChart" [id]="figureId + '-title'">{{ figure.title }}</span>
    <span class="cc-figure-takeaway" [id]="figureId + '-takeaway'">{{ figure.takeaway }}</span>
  </figcaption>

  @if (chartData) {
    <div class="cc-chart-box" [style.inline-size.px]="boxWidth" [style.block-size.px]="boxHeight">
      @if (render) {
        <canvas baseChart role="img" [attr.aria-label]="figure.altText"
                [attr.aria-describedby]="figure.markers.length > 0 ? markersId : null"
                [type]="chartType" [data]="chartData" [options]="chartOptions" [plugins]="chartPlugins"></canvas>
      }
    </div>
  } @else {
    <p class="cc-figure-empty">Nothing to chart in this range.</p>
  }

  @if (figure.markers.length > 0) {
    <ul class="visually-hidden" [id]="markersId" [attr.aria-label]="'Markers on ' + figure.title">
      @for (marker of figure.markers; track marker.tag) {
        <li>{{ marker.tag }}: {{ marker.label }}</li>
      }
    </ul>

    <!-- The spaces and punctuation are pieces of their own: whitespace-only template text is dropped. -->
    <p class="cc-figure-markers">
      @for (piece of markerPieces; track $index) {
        <span [class]="piece.className">{{ piece.text }}</span>
      }
      @if (showEvents.observed) {
        <button type="button" class="btn-link cc-figure-show-events" (click)="showEvents.emit()">Show events</button>
      }
    </p>
  }

  <details class="gh-disclosure cc-figure-data">
    <summary>Show data</summary>
    <div class="gh-disclosure-body">
      <div class="cc-figure-table-scroll">
        <table class="gh-table cc-figure-table">
          <caption class="visually-hidden" [id]="figureId + '-table-caption'">{{ figure.title }}: data per {{ unitNoun }}</caption>
          <thead>
            <tr>
              @for (column of figure.table.columns; track $index) {
                <th scope="col">{{ column }}</th>
              }
            </tr>
          </thead>
          <tbody>
            @for (row of figure.table.rows; track $index) {
              <tr>
                @for (cell of row; track $index) {
                  @if ($first) {
                    <th scope="row">{{ cell }}</th>
                  } @else {
                    <td>{{ cell }}</td>
                  }
                }
              </tr>
            } @empty {
              <tr><td [attr.colspan]="figure.table.columns.length">No {{ unitNoun }}s in this range.</td></tr>
            }
          </tbody>
        </table>
      </div>
    </div>
  </details>
</figure>
