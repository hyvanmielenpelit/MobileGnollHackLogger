<dialog #downloadCenterDialog class="gh-dialog benchmark-download-center-dialog"
        [attr.aria-labelledby]="idPrefix + '-title'"
        (close)="onDialogClose()">
  <div class="dialog-content">
    <div class="dialog-header">
      <div class="dc-title-row">
        <!-- Decorative: the title beside it names the dialog. -->
        <img class="gnollbench-emblem dc-emblem" src="/img/gnollbench/gnollbench-logo-v3-256.webp" alt="" width="64" height="64">
        <div class="dialog-title-group">
          <!-- The focus target on open, so the Close button's tooltip does not open by itself. -->
          <h3 #downloadCenterHeading [id]="idPrefix + '-title'" tabindex="-1">{{ title }}</h3>
          <p class="dialog-subtitle">{{ subtitle }}</p>
        </div>
      </div>
      <button type="button" class="btn-icon-action" aria-label="Close downloads"
              [attr.interestfor]="idPrefix + '-close-tip'"
              [attr.style]="'anchor-name: --' + idPrefix + '-close-tip'"
              (click)="close()">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
      <div popover="hint" class="gh-tooltip" [id]="idPrefix + '-close-tip'"
           [attr.style]="'position-anchor: --' + idPrefix + '-close-tip'">Close downloads</div>
    </div>

    <!-- The body and the footer; the panel's own nested dialogs stop their events inside it. -->
    <app-download-center-panel [idPrefix]="idPrefix" [showCancel]="true"
                               (cancelRequested)="close()"
                               (documentsChanged)="documentsChanged.emit()"></app-download-center-panel>
  </div>
</dialog>
