<!-- YAML IMPORT
     One dialog for three modes: replace one question, import into the open suite, create a suite.
     No closedby="any": light dismiss would lose pasted text. -->
<dialog #dialog class="gh-dialog benchmark-form-dialog benchmark-question-import-dialog"
        aria-labelledby="questionYamlImportTitle"
        (cancel)="onCancel($event)">
  <div class="dialog-content">
    <div class="dialog-header">
      <div class="dialog-title-group">
        <h3 id="questionYamlImportTitle">{{ title }}</h3>
      </div>
      <button type="button" class="btn-icon-action" aria-label="Close YAML import" (click)="close()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width: 20px; height: 20px;">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <div class="dialog-body">
      <ol class="gh-steps" aria-label="Import steps">
        @for (s of steps; track s.id) {
          <li [class.is-done]="step > s.id"
              [attr.aria-current]="step === s.id ? 'step' : null">
            <span class="gh-step-number" aria-hidden="true">{{ s.id }}</span>
            {{ s.label }}
          </li>
        }
      </ol>

      <app-question-yaml-import-panel #panel
                                      idPrefix="questionYamlImport"
                                      [mode]="mode"
                                      [target]="target"
                                      [suite]="suite"
                                      [existing]="existing"
                                      [suites]="suites"
                                      (imported)="imported.emit($event)"
                                      (suiteImported)="suiteImported.emit($event)"
                                      (helpRequested)="helpRequested.emit()"
                                      (stateChange)="onPanelState()" />
    </div>

    <div class="dialog-footer">
      @if (step === 1) {
        <button type="button" class="btn-gh btn-gh-cancel" (click)="close()">Cancel</button>
        <button type="button" class="btn-gh import-validate-btn"
                [attr.aria-disabled]="panel?.canValidate ? null : 'true'"
                [attr.aria-busy]="panel?.validating ? 'true' : null"
                (click)="panel.validate()">Validate</button>
        <button type="button" class="btn-gh import-review-btn"
                [attr.aria-disabled]="panel?.canReview ? null : 'true'"
                (click)="panel.review()">Review changes</button>
      }
      @if (step === 2) {
        <button type="button" class="btn-gh btn-gh-cancel" [attr.aria-disabled]="applying ? 'true' : null" (click)="panel.back()">Back</button>
        <button type="button" class="btn-gh import-apply-btn"
                [attr.aria-disabled]="applying ? 'true' : null"
                [attr.aria-busy]="applying ? 'true' : null"
                (click)="panel.apply()">{{ applying ? 'Applying…' : panel.applyLabel }}</button>
      }
      @if (step === 3) {
        <button type="button" class="btn-gh btn-gh-cancel" (click)="close()">Close</button>
      }
    </div>
  </div>
</dialog>
