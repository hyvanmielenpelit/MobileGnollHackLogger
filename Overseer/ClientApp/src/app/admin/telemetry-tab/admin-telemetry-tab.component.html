<!-- The header, with the Date range and Keys filters and the tab's actions, and the sub-tab row stay at the top while the tab scrolls. -->
<div class="tl-head gh-subtab-head" #tlHead>
  <div class="tab-header-row">
    <h3 class="m-0">AI Telemetry & Request Governor</h3>
    <div class="tl-header-tools">
      <!-- Each value names its dimension, so the labels are visually hidden. -->
      <div class="tl-range" role="group" aria-label="Date range and keys">
        <label for="telemetryTimeSpanSelect" class="visually-hidden">Date range</label>
        <select id="telemetryTimeSpanSelect" class="gh-input" [(ngModel)]="telemetryTimeSpan" (ngModelChange)="onTelemetryTimeSpanChange()">
          @for (span of timeSpans; track span) {
            <option [value]="span">{{ timeSpanLabels[span] }}</option>
          }
        </select>
        @if (telemetryTimeSpan === 'custom') {
          <label for="telemetryStartDateInput" class="visually-hidden">Start date</label>
          <input id="telemetryStartDateInput" type="date" class="gh-input" [(ngModel)]="telemetryStartDate" (ngModelChange)="onCustomDateChange()" [max]="todayDate">
          <span class="tl-range-dash" aria-hidden="true">–</span>
          <label for="telemetryEndDateInput" class="visually-hidden">End date</label>
          <input id="telemetryEndDateInput" type="date" class="gh-input" [(ngModel)]="telemetryEndDate" (ngModelChange)="onCustomDateChange()" [min]="telemetryStartDate" [max]="todayDate">
        }
        <label for="telemetryKeysSelect" class="visually-hidden">Keys</label>
        <select id="telemetryKeysSelect" class="gh-input" [ngModel]="keys" (ngModelChange)="onKeysChange($event)">
          @for (source of keySources; track source) {
            <option [value]="source">{{ keySourceLabels[source] }}</option>
          }
        </select>
      </div>
      <div class="tl-header-actions">
        <button type="button" class="action-btn telemetry-charts-btn" id="tl-charts-btn"
                aria-label="Telemetry charts" aria-haspopup="dialog"
                interestfor="tl-charts-tip" style="anchor-name: --tl-charts-btn"
                (click)="openCharts()">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
        </button>
        <div popover="hint" class="gh-tooltip" id="tl-charts-tip" style="position-anchor: --tl-charts-btn">Charts</div>
        <!-- aria-disabled while a load runs, so the button keeps its focus and its tooltip. -->
        <button type="button" class="action-btn tl-refresh-btn" id="tl-refresh-btn"
                aria-label="Refresh telemetry"
                [attr.aria-disabled]="telemetryLoading || governorLoading ? 'true' : null"
                interestfor="tl-refresh-tip" style="anchor-name: --tl-refresh-btn"
                (click)="refreshFromHeader()">
          @if (telemetryLoading || governorLoading) {
            <span class="gh-spinner-small" aria-hidden="true"></span>
          } @else {
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
          }
        </button>
        <div popover="hint" class="gh-tooltip" id="tl-refresh-tip" style="position-anchor: --tl-refresh-btn">Refresh telemetry</div>
      </div>
    </div>
  </div>

  <div class="gh-tabs gh-tabs-secondary gh-tabs-wrap tl-subtabs" role="tablist" aria-label="AI Telemetry sections">
    @for (tab of subTabs; track tab; let i = $index) {
      <button type="button" role="tab" class="gh-tab"
              [id]="'tl-subtab-' + tab"
              [attr.aria-controls]="'tl-subpanel-' + tab"
              [attr.aria-selected]="subTab === tab"
              [attr.tabindex]="subTab === tab ? 0 : -1"
              (keydown)="onSubTabKeydown($event, i)"
              (click)="selectSubTab(tab)">{{ subTabLabels[tab] }}</button>
    }
  </div>
</div>

<!-- Summary: the summary cards and the governor's partitions. -->
<div role="tabpanel" class="tl-subpanel" id="tl-subpanel-summary" aria-labelledby="tl-subtab-summary" tabindex="0" [hidden]="subTab !== 'summary'">
  <app-telemetry-summary [summary]="telemetrySummary" [keys]="keys" [start]="telemetryStartDate" [end]="telemetryEndDate"
                         [governorStatus]="governorStatus" [governorLoading]="governorLoading"
                         (resetCooldown)="resetGovernorCooldown($event)" />
</div>

<!-- Models: usage by key source, user, model, role and (optionally) thinking level. Mounted on first selection, then kept. -->
<div role="tabpanel" class="tl-subpanel tl-breakdown" id="tl-subpanel-models" aria-labelledby="tl-subtab-models" tabindex="0" [hidden]="subTab !== 'models'">
  @if (isMounted('models')) {
    <app-telemetry-models [summary]="telemetrySummary" [keys]="keys" [start]="telemetryStartDate" [end]="telemetryEndDate"
                          [view]="view" (viewChange)="onViewChange($event)" (usageByUser)="openModelUsers($event)" />
  }
</div>

<!-- Users: AI usage by user in the selected key sources. Mounted on first selection, then kept. -->
<div role="tabpanel" class="tl-subpanel tl-users" id="tl-subpanel-users" aria-labelledby="tl-subtab-users" tabindex="0" [hidden]="subTab !== 'users'">
  @if (isMounted('users')) {
    <app-telemetry-users [startDate]="telemetryStartDate" [endDate]="telemetryEndDate" [keys]="keys"
                         (usageCharts)="openUserCharts($event)" (usageByModel)="openUserModels($event)" />
  }
</div>

<!-- Groups: AI usage by group, each group counting its current members. Mounted on first selection, then kept. -->
<div role="tabpanel" class="tl-subpanel tl-groups" id="tl-subpanel-groups" aria-labelledby="tl-subtab-groups" tabindex="0" [hidden]="subTab !== 'groups'">
  @if (isMounted('groups')) {
    <app-telemetry-groups [startDate]="telemetryStartDate" [endDate]="telemetryEndDate" [keys]="keys"
                          (usageCharts)="openGroupCharts($event)" (usageByModel)="openGroupModels($event)" />
  }
</div>

<!-- Limits: the limits and provider failures that ended or cut chat turns. Mounted on first selection, then kept. -->
<div role="tabpanel" class="tl-subpanel tl-limits" id="tl-subpanel-limits" aria-labelledby="tl-subtab-limits" tabindex="0" [hidden]="subTab !== 'limits'">
  @if (isMounted('limits')) {
    <app-telemetry-limits [startDate]="telemetryStartDate" [endDate]="telemetryEndDate" [keys]="keys" />
  }
</div>

<app-telemetry-charts-dialog #chartsDialog />

<app-telemetry-model-users-dialog #modelUsersDialog />

<app-telemetry-user-models-dialog #userModelsDialog />
