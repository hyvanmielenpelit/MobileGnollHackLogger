      width: 50px;
      height: 50px;

      border-top-color: #d4af37;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;

    .initial-loading-text {
      font-size: 1.1rem;
      color: #aaaaaa;
      letter-spacing: 1px;
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }

      50% { opacity: 1; }
