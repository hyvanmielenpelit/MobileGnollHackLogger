name: Draft Release Notes
on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Project'
        required: true
        type: choice
        options:
          - overseer
          - account
      version:
        description: 'New Version Number (e.g., 1.0.3)'
        required: true

jobs:
  release-notes:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required to see the full history

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run AI Changelog Generator Script
        env:
          AI_PROVIDER: 'openai'
          AI_MODEL: 'gpt-5.6-sol'
          FALLBACK_PROVIDER: 'gemini'
          FALLBACK_MODEL: 'gemini-3.1-pro-preview'
          AI_TEMPERATURE: '0.2'
          AI_REASONING_EFFORT: 'high'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          cd scripts && npm install
          node generate-release-notes.js ${{ github.event.inputs.project }} ${{ github.event.inputs.version }}

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          title: "docs: ${{ github.event.inputs.project }} release notes for v${{ github.event.inputs.version }}"
          body: "Auto-generated release notes for **${{ github.event.inputs.project }}** by AI. Please review, edit if necessary, and merge."
          branch: "release-notes/${{ github.event.inputs.project }}/v${{ github.event.inputs.version }}"
